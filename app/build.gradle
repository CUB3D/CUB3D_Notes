plugins {
    id 'com.google.devtools.ksp'
    id("org.jetbrains.kotlin.plugin.compose") version "$compose_version"
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'io.sentry.android.gradle'
apply plugin: 'org.jetbrains.dokka'

android {
    namespace "pw.cub3d.cub3_notes"
    compileSdk 37
    defaultConfig {
        applicationId "pw.cub3d.cub3_notes"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 8
        versionName "1.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // For room migrations
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    buildFeatures {
        dataBinding = true
        compose = true
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // For Kotlin projects
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
//    composeOptions {
//        kotlinCompilerExtensionVersion compose_version
//    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Selection
    implementation 'androidx.recyclerview:recyclerview-selection:1.2.0'


    // Paging
    def paging_version = '3.5.1'
    implementation "androidx.paging:paging-runtime-ktx:$paging_version"

    // Navigation
    def nav = '2.9.8'
    implementation "androidx.navigation:navigation-ui-ktx:$nav"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav"

    // Room
    def roomVersion = '2.8.4'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"

    // Lifecycle
    def lifecycle_version = '2.11.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    kapt "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    // Workmanager:
    def work_version = '2.11.2'
    implementation "androidx.work:work-runtime-ktx:$work_version"

    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.9'

    //Dagger
    def daggerVersion = '2.59.1'
    api "com.google.dagger:dagger:$daggerVersion"
    kapt "com.google.dagger:dagger-compiler:$daggerVersion"
    kapt "com.google.dagger:dagger-android-processor:$daggerVersion"

    // Sentry
    implementation 'io.sentry:sentry-android:8.32.0'

    // Moshi
    implementation "com.squareup.moshi:moshi:1.15.2"
    ksp "com.squareup.moshi:moshi-kotlin-codegen:1.15.2"

    // Calendar
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'

    // JSoup for parsing opengraph for link info
    implementation 'org.jsoup:jsoup:1.23.2'

    // Glide
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    ksp 'com.github.bumptech.glide:compiler:5.0.9'

    implementation 'com.github.evilbunny2008:android-material-color-picker-dialog:1.3.7'

    // Video playback
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    //Markwon
    final def markwon_version = '4.6.2'
    implementation "io.noties.markwon:core:$markwon_version"
    implementation "io.noties.markwon:editor:$markwon_version"
    implementation "io.noties.markwon:ext-latex:$markwon_version"
    implementation "io.noties.markwon:ext-strikethrough:$markwon_version"
    implementation "io.noties.markwon:ext-tables:$markwon_version"
    implementation "io.noties.markwon:ext-tasklist:$markwon_version"
    implementation "io.noties.markwon:html:$markwon_version"
    implementation "io.noties.markwon:image-glide:$markwon_version"
    implementation "io.noties.markwon:linkify:$markwon_version"
//    implementation  "io.noties.markwon:syntax-highlight:$markwon_version"

    // Permissions
//    def easypermission_version = "2.0.2"
//    implementation "com.sagar:coroutinespermission:$easypermission_version"

    // Detect memory leaks
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'


    // Jetpack compose
    implementation "androidx.compose.ui:ui:1.10.3"
    // Tooling support (Previews, etc.)
    implementation "androidx.compose.ui:ui-tooling:1.10.3"
    // Foundation (Border, Background, Box, Image, Scroll, shapes, animations, etc.)
    implementation "androidx.compose.foundation:foundation:1.10.3"
    // Material Design
    implementation "androidx.compose.material:material:1.10.3"
    // Material design icons
    implementation "androidx.compose.material:material-icons-core:1.7.8"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    // Integration with activities
    implementation 'androidx.activity:activity-compose:1.13.0'
    // Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    // Integration with observables
    implementation "androidx.compose.runtime:runtime-livedata:1.12.0"

    // UI Tests
//    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"

    // Accompanist
    implementation "com.google.accompanist:accompanist-glide:0.15.0"

    // Reorderable list
    implementation "org.burnoutcrew.composereorderable:reorderable:0.7.4"
}

kotlin {
    dependencies {
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    }
}
